# Android 測試版 APK（debug 簽署，可側載，不需 Google Play 帳號）
name: Android 測試版 APK
on: { workflow_dispatch: {} }
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - name: 產生測試資料預覽檔
        run: bash backend/scripts/build-test-export.sh
      - name: 指向已部署的資料網址（App 開啟時抓最新行情，連不到時用內附資料）
        run: |
          OWNER='${{ github.repository_owner }}'; REPO='${{ github.event.repository.name }}'
          if [ '${{ vars.ENABLE_PAGES }}' = 'true' ]; then echo "window.JCJ_DATA_BASE = 'https://${OWNER,,}.github.io/${REPO}/data';" > app/www/config.js; fi
          cat app/www/config.js
      - name: 建置
        run: |
          cd app && npm ci && npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: 'jcj-v0.1.0-debug-apk', path: app/android/app/build/outputs/apk/debug/app-debug.apk }
