# 部署 GitHub Pages 並驗證網頁讀到的資料。
# 預設關閉：在 repo 的 Settings → Secrets and variables → Actions → Variables 新增 ENABLE_PAGES = true 才會執行。
name: 部署網頁
on:
  workflow_run: { workflows: ['更新行情'], types: [completed] }
  workflow_dispatch: {}
permissions: {}
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    if: vars.ENABLE_PAGES == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.repository.default_branch }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 產生測試資料預覽檔（標示「測試資料」，與正式資料分開）
        run: bash backend/scripts/build-test-export.sh
      - uses: actions/upload-pages-artifact@v3
        with: { path: app/www }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    outputs: { url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.repository.default_branch }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 網頁資料與 repo 一致，並對照一筆原始報價
        env: { URL: '${{ needs.deploy.outputs.url }}data/official.json' }
        run: sleep 20 && node backend/scripts/verify-pages.mjs "$URL"
