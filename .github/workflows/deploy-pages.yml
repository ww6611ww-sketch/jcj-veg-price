# 部署 GitHub Pages 並驗證網頁讀到的資料。
# 預設關閉：在 repo 的 Settings → Secrets and variables → Actions → Variables 新增 ENABLE_PAGES = true 才會執行。
name: 部署網頁
on:
  workflow_run: { workflows: ['更新行情'], types: [completed] }
  workflow_dispatch: {}
permissions: {}
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    if: vars.ENABLE_PAGES == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.repository.default_branch }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 產生測試資料預覽檔（標示「測試資料」，與正式資料分開）
        run: bash backend/scripts/build-test-export.sh
      - uses: actions/upload-pages-artifact@v3
        with: { path: app/www }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    outputs: { url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.repository.default_branch }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 網頁資料與 repo 一致，並對照一筆原始報價
        env: { URL: '${{ needs.deploy.outputs.url }}data/official.json' }
        run: sleep 20 && node backend/scripts/verify-pages.mjs "$URL"
      - name: 實際開啟網頁（無頭 Chrome）確認比價頁顯示同一筆報價
        env: { SITE: '${{ needs.deploy.outputs.url }}' }
        run: |
          google-chrome --version
          google-chrome --headless=new --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=15000 --dump-dom "${SITE}#compare-cauliflower" > page.html
          node -e "
            const fs=require('fs');const h=fs.readFileSync('page.html','utf8');
            const text=h.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
            const sm=JSON.parse(fs.readFileSync('backend/data/official/sample.json','utf8'));
            const i=text.indexOf(sm.market);const seg=i<0?'':text.slice(i,i+80);
            const want=String(sm.appData['元每台斤']);
            const out={標題:(h.match(/<title>([^<]*)/)||[])[1],比價列:seg.trim(),預期價格:want,顯示正確:seg.includes(' '+want+' ')||seg.includes('>'+want+'<')||new RegExp('\\\\b'+want+'\\\\s*元／台斤').test(seg)};
            console.log(out);fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\n## 網頁實際畫面\n\n'+Object.entries(out).map(([k,v])=>'- '+k+'：'+v).join('\n')+'\n');
            if(!out.顯示正確)process.exit(1);"
